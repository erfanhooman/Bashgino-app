# Dependency and action updates — monthly, grouped.
#
# This app ships to phones on a human-reviewed tag, so a steady drip of major
# bumps is noise. Expo SDK upgrades are deliberately a manual, tested task
# (`npx expo install --fix`), not an automated PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    # The Expo SDK pins its own compatible versions of these; bumping them on
    # their own produces a broken native build.
    ignore:
      - dependency-name: "expo*"
      - dependency-name: "react-native*"
      - dependency-name: "@react-native*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      # Toolchain majors break the type/lint plugins that drive `npm run verify`,
      # not the app: TypeScript 7 crashes typescript-eslint ("reading 'Intrinsic'")
      # and ESLint 10 removed the context API that eslint-plugin-react still uses.
      # Both are deliberate, tested upgrades, never a drive-by PR.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/*"
        update-types: ["version-update:semver-major"]
    groups:
      # Everything else, one PR per month.
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
