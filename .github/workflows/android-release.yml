name: Android Release

# ═══════════════════════════════════════════════════════════════════════════
# Independent Android release pipeline.
#
#   git tag -a v1.2.0 -m "Bashgino Android 1.2.0"
#   git push origin v1.2.0
#
# Produces, for the tag:
#   * app-release.apk  — signed with the upload key, attachable directly
#   * app-release.aab  — the bundle Google Play (and Iranian markets) accept
#   * a GitHub Release with both files attached and generated notes
#
# MARKETPLACE SUBMISSION IS MANUAL BY DESIGN. Nothing here uploads to Google
# Play, Myket, Bazaar or anywhere else — an automated publish is a one-way door
# and must stay a human decision.
#
# The build runs locally on the runner (gradle) rather than on a hosted build
# service: no vendor account, no queue, and the signing key never leaves GitHub
# Secrets. `eas.json` is kept for developers who prefer EAS for local device
# builds; it is not used by this workflow.
# ═══════════════════════════════════════════════════════════════════════════

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (must already exist, e.g. v1.2.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: build signed APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # Do not install the obsolete `tools` package — sdkmanager 16+ no longer
          # ships it and the action's default list fails the whole release.
          packages: platform-tools
          log-accepted-android-sdk-licenses: true

      # ── version from the tag ──────────────────────────────────────────────
      - name: Resolve version
        id: version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)([-+].*)?$ ]]; then
            echo "::error::'$TAG' is not a semantic version tag (expected v1.2.3)"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
          # Monotonic integer for Play/marketplaces: 1.2.3 -> 10203.
          code=$(( major * 10000 + minor * 100 + patch ))
          {
            echo "name=$TAG"
            echo "semver=${TAG#v}"
            echo "code=$code"
          } >> "$GITHUB_OUTPUT"
          echo "building $TAG (versionName=${TAG#v}, versionCode=$code)"

      - name: Check the release signing key is configured
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for pair in "ANDROID_KEYSTORE_BASE64=$KEYSTORE" "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" \
                      "ANDROID_KEY_ALIAS=$KEY_ALIAS" "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"; do
            if [[ -z "${pair#*=}" ]]; then
              echo "::error::secret ${pair%%=*} is not set — a release without the upload key is unusable"
              missing=1
            fi
          done
          # gradle would silently fall back to the DEBUG keystore, producing an
          # APK that can never be updated. Refuse instead.
          exit "$missing"

      # ── quality gate ──────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, tokens and tests
        run: npm run verify

      # ── configure the build ───────────────────────────────────────────────
      - name: Stamp version and public API origin into the app config
        env:
          VERSION_NAME: ${{ steps.version.outputs.semver }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$API_URL" ]]; then
            echo "::error::repository variable EXPO_PUBLIC_API_URL is not set (expected https://api.bashgino.ir)"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const path = "app.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            config.expo.version = process.env.VERSION_NAME;
            config.expo.android.versionCode = Number(process.env.VERSION_CODE);
            // EXPO_PUBLIC_API_URL is inlined into the bundle as well; this keeps
            // the app-config fallback in step so a dev build cannot silently
            // point at the 10.0.2.2 emulator alias.
            config.expo.extra = { ...(config.expo.extra || {}), apiUrl: process.env.API_URL };
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          '
          grep -E '"(version|versionCode|apiUrl)"' app.json

      - name: Provide the upload keystore to gradle
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/bashgino-upload.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"

          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<EOF
          BASHGINO_UPLOAD_STORE_FILE=$keystore
          BASHGINO_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD
          BASHGINO_UPLOAD_KEY_ALIAS=$KEY_ALIAS
          BASHGINO_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD
          EOF
          chmod 600 "$HOME/.gradle/gradle.properties"
          echo "keystore staged (contents never printed)"

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install

      # ── build ─────────────────────────────────────────────────────────────
      - name: Build release APK
        working-directory: android
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build release AAB
        working-directory: android
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      # ── verify what we are about to publish ───────────────────────────────
      - name: Verify the APK is signed with the upload key (not the debug key)
        env:
          VERSION: ${{ steps.version.outputs.semver }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          aab="android/app/build/outputs/bundle/release/app-release.aab"
          [[ -f "$apk" ]] || { echo "::error::$apk missing"; exit 1; }
          [[ -f "$aab" ]] || { echo "::error::$aab missing"; exit 1; }

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          echo "sdk=$SDK"

          find_apksigner() {
            find "$SDK/build-tools" -maxdepth 2 -name apksigner -type f 2>/dev/null | sort -V | tail -1
          }
          apksigner="$(find_apksigner)"
          if [[ -z "$apksigner" ]]; then
            # build-tools is installed by AGP on demand; make it explicit so this
            # step never depends on whatever gradle happened to download.
            sdkmanager="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)"
            [[ -n "$sdkmanager" ]] || { echo "::error::sdkmanager not found under $SDK"; exit 1; }
            echo "installing build-tools;36.0.0"
            "$sdkmanager" --install "build-tools;36.0.0" >/dev/null
            apksigner="$(find_apksigner)"
          fi
          [[ -n "$apksigner" ]] || { echo "::error::apksigner still missing"; ls -la "$SDK" || true; exit 1; }
          echo "apksigner=$apksigner"

          if ! certs="$("$apksigner" verify --print-certs "$apk" 2>&1)"; then
            echo "::error::apksigner says the APK does not verify"
            echo "$certs"
            exit 1
          fi
          echo "$certs"

          if grep -qi "Android Debug" <<< "$certs"; then
            echo "::error::the APK is signed with the DEBUG key — it can never be published or updated"
            exit 1
          fi

          # The signer certificate must be the upload key we staged, not just
          # "some non-debug key": compare the SHA-256 digests.
          # apksigner prints "Signer #1 certificate SHA-256 digest:" for v1/v3
          # signers and "V2 Signer: certificate SHA-256 digest:" for v2 — match both.
          apk_sha="$(sed -n 's/.*certificate SHA-256 digest:[[:space:]]*//p' <<< "$certs" | head -1 | tr -d ' :' | tr 'A-F' 'a-f')"
          keystore="$HOME/.gradle/gradle.properties"
          ks_file="$(sed -n 's/^BASHGINO_UPLOAD_STORE_FILE=//p' "$keystore")"
          ks_pass="$(sed -n 's/^BASHGINO_UPLOAD_STORE_PASSWORD=//p' "$keystore")"
          ks_sha="$(keytool -list -v -keystore "$ks_file" -alias "$KEY_ALIAS" -storepass "$ks_pass" 2>/dev/null \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ' :' | tr 'A-F' 'a-f')"
          echo "apk_cert_sha256=$apk_sha"
          echo "keystore_sha256=$ks_sha"
          if [[ -z "$apk_sha" || -z "$ks_sha" ]]; then
            echo "::error::could not read both certificate digests"
            exit 1
          fi
          if [[ "$apk_sha" != "$ks_sha" ]]; then
            echo "::error::the APK is not signed with the configured upload key"
            exit 1
          fi

          mkdir -p out
          cp "$apk" "out/bashgino-${VERSION}.apk"
          cp "$aab" "out/bashgino-${VERSION}.aab"
          ls -lh out

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: bashgino-android-${{ steps.version.outputs.semver }}
          path: out/*
          retention-days: 90

      # ── publish to the GitHub Release ─────────────────────────────────────
      - name: Attach artefacts to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.name }}
          name: Bashgino ${{ steps.version.outputs.semver }}
          generate_release_notes: true
          files: |
            out/bashgino-${{ steps.version.outputs.semver }}.apk
            out/bashgino-${{ steps.version.outputs.semver }}.aab
          body: |
            ## Bashgino Android ${{ steps.version.outputs.semver }}

            Built from `${{ github.sha }}`.

            | File | Use |
            | --- | --- |
            | `bashgino-${{ steps.version.outputs.semver }}.apk` | direct install / internal distribution |
            | `bashgino-${{ steps.version.outputs.semver }}.aab` | marketplace upload (manual) |

            **Marketplace submission is manual** — nothing is published to Google Play,
            Myket or Bazaar by this pipeline.
